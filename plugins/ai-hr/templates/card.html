<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>电脑人格画像</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 720px; height: 1280px; margin: 0 auto;
         font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #14161f; color: #f5f2ea;
         display: flex; flex-direction: column; padding: 56px 48px; }
  .kicker { font-size: 22px; letter-spacing: 6px; color: #8b8fa3; }
  h1 { font-size: 64px; line-height: 1.15; margin: 18px 0 30px; color: #ffd166; }
  .portrait { width: 100%; height: 520px; border-radius: 24px;
              object-fit: cover; background: #262a3a; }
  .desc { font-size: 27px; line-height: 1.65; margin: 34px 0; color: #d9d5c9; }
  .stats { display: flex; gap: 20px; margin-top: auto; }
  .stat { flex: 1; background: #1e2130; border-radius: 18px; padding: 22px 16px;
          text-align: center; }
  .stat b { display: block; font-size: 40px; color: #ffd166; }
  .stat span { font-size: 19px; color: #8b8fa3; }
  footer { margin-top: 36px; font-size: 19px; color: #5c6070;
           text-align: center; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="kicker">电脑人格画像</div>
  <h1>{{PERSONA_NAME}}</h1>
  <img class="portrait" src="{{IMAGE_SRC}}" alt="">
  <p class="desc">{{DESC}}</p>
  <div class="stats">
    <div class="stat"><b>{{STAT_1_NUM}}</b><span>{{STAT_1_LABEL}}</span></div>
    <div class="stat"><b>{{STAT_2_NUM}}</b><span>{{STAT_2_LABEL}}</span></div>
    <div class="stat"><b>{{STAT_3_NUM}}</b><span>{{STAT_3_LABEL}}</span></div>
  </div>
  <footer>{{FOOTER}}</footer>
</body>
</html>
